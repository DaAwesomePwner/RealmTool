name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Diagnose toolchains
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --version
      - name: Install npm dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build native helper
        run: npm run build:helper
      - name: Build UI for Rust tests
        # Plain cargo test uses tauri.conf.json, without the packaging resource overlay.
        run: npm run ui:build
      - name: Test Rust sidecar
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Clear previous installer bundles
        run: |
          if ($env:CARGO_TARGET_DIR) {
            $bundle = Join-Path $env:CARGO_TARGET_DIR 'release\bundle'
            if (Test-Path -LiteralPath $bundle) {
              Remove-Item -LiteralPath $bundle -Recurse -Force
            }
          }
      - name: Build packaged app
        run: npm run build:app
      - name: Smoke test packaged backend with fake game files
        run: node tools/smoke-package.ts
